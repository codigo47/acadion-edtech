apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acadion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/codigo47/acadion.git
    targetRevision: dev
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: acadion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
