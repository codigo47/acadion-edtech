version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cursos_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cursos
    ports:
      - "5588:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
